name: Trigger auto deployment for backendcontainer

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/backendcontainer-AutoDeployTrigger-b82e381e-6a8a-4be4-849c-0116c582005a.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BACKENDCONTAINER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BACKENDCONTAINER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BACKENDCONTAINER_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/session3-api/DockerFile
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: containeregistryfb.azurecr.io
          registryUsername: ${{ secrets.BACKENDCONTAINER_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.BACKENDCONTAINER_REGISTRY_PASSWORD }}
          containerAppName: backendcontainer
          resourceGroup: FB
          imageToBuild: containeregistryfb.azurecr.io/backendcontainer:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


